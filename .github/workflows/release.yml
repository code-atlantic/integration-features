name: Release

run-name: Release (${{ github.event_name == 'push' && github.ref_name || format('dry run {0}', inputs.version) }})

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to package in a release-free dry run (with or without a v prefix).
        required: true
        default: '0.4.2'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Get version from tag
        id: get_version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git_tag="$DISPATCH_VERSION"
          fi
          version="${git_tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version/tag must be N.N.N or vN.N.N, optionally with a prerelease suffix."
            exit 1
          fi
          header_version="$(awk -F: '/^[[:space:]]*\*?[[:space:]]*Version:/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' integration-features.php)"
          test "$header_version" = "$version"
          {
            echo "VERSION=$version"
            echo "GIT_TAG=$git_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create plugin zip
        run: |
          # Create a clean directory for the release
          # Folder name must match the installed plugin folder
          mkdir -p release/integration-features

          # Copy only the files needed for production
          cp -r build release/integration-features/
          cp integration-features.php release/integration-features/
          cp readme.txt release/integration-features/ 2>/dev/null || true
          cp CHANGELOG.md release/integration-features/ 2>/dev/null || true
          cp LICENSE release/integration-features/ 2>/dev/null || true

          # Create the zip file
          # Asset name must be $repo-*.zip for Git Updater (repo slug: integration-features)
          cd release
          zip -r ../integration-features-${{ steps.get_version.outputs.VERSION }}.zip integration-features
          cd ..

      - name: Smoke-test and inspect the shipped archive
        run: |
          set -euo pipefail
          archive="integration-features-${{ steps.get_version.outputs.VERSION }}.zip"
          smoke="$(mktemp -d)"
          trap 'rm -rf "$smoke"' EXIT
          unzip -q "$archive" -d "$smoke"
          test -f "$smoke/integration-features/integration-features.php"
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find "$smoke/integration-features" -name '*.php' -print0)
          if unzip -Z1 "$archive" | grep -E '(^|/)(node_modules|tests|\.github)/|\.map$|\.DS_Store$'; then
            echo '::error::Release archive contains development-only content.'
            exit 1
          fi

      - name: Upload release-free proof artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-zip
          path: integration-features-${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 5

      - name: Extract changelog for this version
        id: changelog
        if: github.event_name == 'push'
        run: |
          # Extract changelog section for this version
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHANGELOG=$(awk "/^## \[?${VERSION}\]?/,/^## \[?[0-9]/" CHANGELOG.md | sed '$d' | tail -n +2)

          # If no changelog found, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version ${VERSION}"
          fi

          # Write to file for multi-line support
          echo "$CHANGELOG" > changelog_extract.txt

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: integration-features-${{ steps.get_version.outputs.VERSION }}.zip
          body_path: changelog_extract.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
