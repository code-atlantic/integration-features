name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint JavaScript
        run: npm run lint:js
        continue-on-error: true  # Existing product lint debt remains non-blocking.

      - name: Lint CSS
        run: npm run lint:css
        continue-on-error: true  # Existing product lint debt remains non-blocking.

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          # Ensure all expected build files exist
          test -f build/integration-features/index.js
          test -f build/integration-features/view.js
          test -f build/integration-features-group/index.js
          test -f build/integration-features-group/view.js
          test -f build/section-heading/index.js
          echo "✅ All build artifacts verified"

  composer-install:
    name: Composer install and Strauss
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [test, composer-install]
    if: always()
    steps:
      - name: Require every CI job to run and pass
        env:
          TEST: ${{ needs.test.result }}
          COMPOSER_INSTALL: ${{ needs.composer-install.result }}
        run: |
          set -euo pipefail
          {
            echo '## CI summary'
            echo "- Frontend tests and build: $TEST"
            echo "- Composer install and Strauss: $COMPOSER_INSTALL"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$TEST" = success
          test "$COMPOSER_INSTALL" = success
